<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avalon20 • A Birthday Story</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="stylesheet" href="/css/avalon20.css" />

    <meta
      name="description"
      content="A handcrafted birthday experience filled with memories, surprises, and love."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Avalon20" />
    <meta
      property="og:description"
      content="A handcrafted birthday experience filled with memories, surprises, and love."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Avalon20" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avalon20" />
    <meta
      name="twitter:description"
      content="A handcrafted birthday experience filled with memories, surprises, and love."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="intro" id="intro">
      <div class="intro-num" id="introNum">0</div>
      <div class="intro-label">loading memories...</div>
    </div>

    <div class="hero" id="hero">
      <button
        class="watermark-btn"
        id="triggerBtn"
        aria-label="Press to reveal your age"
      >
        <span class="watermark" id="watermark">00</span>
        <span class="reveal-flash" id="revealFlash"></span>
      </button>

      <span class="corner br" id="liveReadout">—</span>
    </div>

    <div class="ember-layer" id="emberLayer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="/js/avalon20.js"></script>
  </body>
</html>
